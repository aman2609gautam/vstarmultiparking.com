    <!-- Logo Section -->
    <div class="logo">
        <a href="index.html">
            <img src="images/logo.png"

            <div class="logo-text">
                <span class="brand-name">VStar Multiparking Systems</span>
                <span class="tagline">LIMITLESS INNOVATION</span>

<!-- =====================================================
     CONTACT SECTION
     ===================================================== -->
<section>

    <h3 class="section-title">Contact Us</h3>

    <!-- ===============================
         ENQUIRY FORM
         NOTE:
         - Uses mailto (no backend required)
         - Can be upgraded later to PHP/API
    =============================== -->
    <form action="mailto:vstarmultiparkingsystem21@gmail.com"
          method="post"
          enctype="text/plain">

        <input type="text"
               name="Name"
               placeholder="Your Name"
               required>

        <input type="email"
               name="Email"
               placeholder="Email Address"
               required>

        <input type="tel"
               name="Phone"
               placeholder="Phone Number">

        <textarea name="Requirement"
                  placeholder="Your Requirement"></textarea>

        <button type="submit">Send Enquiry</button>

    </form>

    <!-- ===============================
         GOOGLE MAP (HEAD OFFICE LOCATION)
    =============================== -->
    <br>

    <iframe
        src="https://www.google.com/maps?q=Mumbai&output=embed"
        width="100%"
        height="300"
        style="border:0;"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        aria-label="VStar Multiparking Systems Mumbai Location">
    </iframe>

</section>
